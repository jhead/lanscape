name: Build and Release Tauri App

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
    paths:
      - 'packages/tauri/**'
      - 'packages/chat/**'
      - 'lanscape-agent/**'
      - '.github/workflows/build-tauri.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'packages/tauri/**'
      - 'packages/chat/**'
      - 'lanscape-agent/**'
      - '.github/workflows/build-tauri.yml'
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write
    
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            arch: x64
          - target: aarch64-apple-darwin
            arch: arm64
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            packages/tauri/src-tauri/target
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-rust-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-${{ matrix.target }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build chat package
        run: pnpm --filter @lanscape/chat build

      - name: Build Tauri app for macOS
        working-directory: packages/tauri
        run: pnpm tauri build --target ${{ matrix.target }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: Lanscape-mac-${{ matrix.arch }}.dmg
          path: packages/tauri/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload macOS App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: Lanscape-mac-${{ matrix.arch }}.app
          path: packages/tauri/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload macOS ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Lanscape-mac-${{ matrix.arch }}.zip
          path: packages/tauri/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.zip
          if-no-files-found: ignore
          retention-days: 30

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: aarch64-pc-windows-msvc
            arch: arm64
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            packages/tauri/src-tauri/target
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-rust-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-${{ matrix.target }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build chat package
        run: pnpm --filter @lanscape/chat build

      - name: Build Tauri app for Windows
        working-directory: packages/tauri
        shell: pwsh
        run: pnpm tauri build --target ${{ matrix.target }}
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

      - name: Upload Windows MSI
        uses: actions/upload-artifact@v4
        with:
          name: Lanscape-win-${{ matrix.arch }}.msi
          path: packages/tauri/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Windows NSIS
        uses: actions/upload-artifact@v4
        with:
          name: Lanscape-win-${{ matrix.arch }}.exe
          path: packages/tauri/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Lanscape-win-${{ matrix.arch }}.zip
          path: packages/tauri/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.zip
          if-no-files-found: ignore
          retention-days: 30

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Lanscape-mac-*
          path: dist/macos
          merge-multiple: true

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Lanscape-win-*
          path: dist/windows
          merge-multiple: true

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/macos/**
            dist/windows/**
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts to workflow run
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: tauri-builds
          path: |
            dist/macos/**
            dist/windows/**
          retention-days: 7

